  <!-- 外外框底圖 -->
  <rect width="960" height="700" fill="url(#bgGlow)"/>
  <rect x="15" y="15" width="930" height="670" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- 頂部標題區 -->
  <g transform="translate(480, 42)">
    <text text-anchor="middle" font-size="20" font-weight="800" fill="#f8fafc" letter-spacing="1">
      🚀《STEAM 奇想造物社》5+1 六大桌工坊空間動線配置圖
    </text>
    <text text-anchor="middle" y="24" font-size="12" fill="#94a3b8">
      全班 30 位學員（15 組深度協作）｜ 5 大學生自治實作島 ｜ 1 前導置物·評分·課程協助桌 ｜ 1.2M 安全走道
    </text>
  </g>

  <!-- ══════════════════ 講台核心指揮區 ══════════════════ -->
