<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft JhengHei', sans-serif;">
  <defs>
    <linearGradient id="wbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="matGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 背景與外框 -->
  <rect width="960" height="560" fill="#0f172a"/>
  <rect x="16" y="16" width="928" height="528" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- 電子白板（上方置中） -->
  <g transform="translate(260, 36)" filter="url(#shadow)">
    <rect x="0" y="0" width="440" height="56" rx="10" fill="url(#wbGrad)" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="220" y="35" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="3">電子白板</text>
  </g>

  <!-- 發放材料的桌子（右側前方） -->
  <g transform="translate(740, 36)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="64" rx="10" fill="url(#matGrad)" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="80" y="38" text-anchor="middle" font-size="18" font-weight="800" fill="#fef3c7">材料發放桌</text>
  </g>

  <!-- 第 1 桌（上排左） -->
  <g transform="translate(80, 160)" filter="url(#shadow)">
    <circle cx="40" cy="-16" r="11" fill="#38bdf8"/>
    <circle cx="100" cy="-16" r="11" fill="#38bdf8"/>
    <circle cx="160" cy="-16" r="11" fill="#38bdf8"/>
    <circle cx="40" cy="106" r="11" fill="#38bdf8"/>
    <circle cx="100" cy="106" r="11" fill="#38bdf8"/>
    <circle cx="160" cy="106" r="11" fill="#38bdf8"/>
    <rect x="0" y="0" width="200" height="90" rx="12" fill="url(#tableGrad)" stroke="#475569" stroke-width="2.5"/>
    <text x="100" y="42" text-anchor="middle" font-size="20" font-weight="800" fill="#f8fafc">第 1 桌</text>
    <text x="100" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#94a3b8">6 人</text>
  </g>

  <!-- 第 2 桌（上排中） -->
  <g transform="translate(380, 160)" filter="url(#shadow)">
    <circle cx="40" cy="-16" r="11" fill="#38bdf8"/>
    <circle cx="100" cy="-16" r="11" fill="#38bdf8"/>
    <circle cx="160" cy="-16" r="11" fill="#38bdf8"/>
    <circle cx="40" cy="106" r="11" fill="#38bdf8"/>
    <circle cx="100" cy="106" r="11" fill="#38bdf8"/>
    <circle cx="160" cy="106" r="11" fill="#38bdf8"/>
    <rect x="0" y="0" width="200" height="90" rx="12" fill="url(#tableGrad)" stroke="#475569" stroke-width="2.5"/>
    <text x="100" y="42" text-anchor="middle" font-size="20" font-weight="800" fill="#f8fafc">第 2 桌</text>
    <text x="100" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#94a3b8">6 人</text>
  </g>

  <!-- 第 3 桌（上排右） -->
  <g transform="translate(680, 160)" filter="url(#shadow)">
    <circle cx="40" cy="-16" r="11" fill="#38bdf8"/>
    <circle cx="100" cy="-16" r="11" fill="#38bdf8"/>
    <circle cx="160" cy="-16" r="11" fill="#38bdf8"/>
    <circle cx="40" cy="106" r="11" fill="#38bdf8"/>
    <circle cx="100" cy="106" r="11" fill="#38bdf8"/>
    <circle cx="160" cy="106" r="11" fill="#38bdf8"/>
    <rect x="0" y="0" width="200" height="90" rx="12" fill="url(#tableGrad)" stroke="#475569" stroke-width="2.5"/>
    <text x="100" y="42" text-anchor="middle" font-size="20" font-weight="800" fill="#f8fafc">第 3 桌</text>
    <text x="100" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#94a3b8">6 人</text>
  </g>

  <!-- 第 4 桌（下排左） -->
  <g transform="translate(220, 370)" filter="url(#shadow)">
    <circle cx="40" cy="-16" r="11" fill="#38bdf8"/>
    <circle cx="100" cy="-16" r="11" fill="#38bdf8"/>
    <circle cx="160" cy="-16" r="11" fill="#38bdf8"/>
    <circle cx="40" cy="106" r="11" fill="#38bdf8"/>
    <circle cx="100" cy="106" r="11" fill="#38bdf8"/>
    <circle cx="160" cy="106" r="11" fill="#38bdf8"/>
    <rect x="0" y="0" width="200" height="90" rx="12" fill="url(#tableGrad)" stroke="#475569" stroke-width="2.5"/>
    <text x="100" y="42" text-anchor="middle" font-size="20" font-weight="800" fill="#f8fafc">第 4 桌</text>
    <text x="100" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#94a3b8">6 人</text>
  </g>

  <!-- 第 5 桌（下排右） -->
  <g transform="translate(540, 370)" filter="url(#shadow)">
    <circle cx="40" cy="-16" r="11" fill="#38bdf8"/>
    <circle cx="100" cy="-16" r="11" fill="#38bdf8"/>
    <circle cx="160" cy="-16" r="11" fill="#38bdf8"/>
    <circle cx="40" cy="106" r="11" fill="#38bdf8"/>
    <circle cx="100" cy="106" r="11" fill="#38bdf8"/>
    <circle cx="160" cy="106" r="11" fill="#38bdf8"/>
    <rect x="0" y="0" width="200" height="90" rx="12" fill="url(#tableGrad)" stroke="#475569" stroke-width="2.5"/>
    <text x="100" y="42" text-anchor="middle" font-size="20" font-weight="800" fill="#f8fafc">第 5 桌</text>
    <text x="100" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#94a3b8">6 人</text>
  </g>
</svg>
