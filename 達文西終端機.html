<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 達文西工坊：六位數機關密碼鎖終端機</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #111827;
      --gold-primary: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.4);
      --brass: #d97706;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-brass: #b45309;
      --accent-green: #10b981;
      --accent-red: #ef4444;
    }
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #1e293b 0%, var(--bg-dark) 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* 頂部控制列 */
    .top-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid #334155;
      position: fixed;
      top: 0;
      z-index: 50;
    }
    .brand-title {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .timer-display {
      font-family: "Courier New", Courier, monospace;
      font-size: 1.85rem;
      font-weight: 900;
      color: #38bdf8;
      background: #020617;
      padding: 4px 18px;
      border-radius: 8px;
      border: 1.5px solid #0284c7;
      letter-spacing: 2px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }
    .timer-controls {
      display: flex;
      gap: 6px;
    }
    .btn-ctrl {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-ctrl:hover { background: #475569; }

    /* 主機台面板 */
    .terminal-container {
      margin-top: 85px;
      margin-bottom: 25px;
      width: 95%;
      max-width: 820px;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 3px solid var(--border-brass);
      border-radius: 20px;
      padding: 34px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px var(--gold-glow);
      text-align: center;
      position: relative;
    }

    /* 鉚釘裝飾 */
    .rivet {
      position: absolute;
      width: 14px;
      height: 14px;
      background: radial-gradient(circle, #f59e0b, #78350f);
      border-radius: 50%;
      border: 1px solid #451a03;
      box-shadow: inset 1px 1px 2px rgba(255,255,255,0.5), 1px 1px 3px rgba(0,0,0,0.8);
    }
    .rivet.tl { top: 12px; left: 12px; }
    .rivet.tr { top: 12px; right: 12px; }
    .rivet.bl { bottom: 12px; left: 12px; }
    .rivet.br { bottom: 12px; right: 12px; }

    .header-sub {
      color: #fbbf24;
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .header-main {
      font-size: 2.15rem;
      font-weight: 900;
      margin: 0 0 10px 0;
      background: linear-gradient(135deg, #fef08a, #f59e0b, #d97706);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
    }
    .prompt-text {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    /* 六位數密碼輸入槽 */
    .code-slots-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 28px 0;
    }
    .code-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .slot-label {
      font-size: 0.78rem;
      font-weight: 800;
      color: #94a3b8;
    }
    .slot-input {
      width: 64px;
      height: 78px;
      background: #020617;
      border: 2.5px solid #475569;
      border-radius: 12px;
      color: #f8fafc;
      font-size: 2.4rem;
      font-weight: 900;
      text-align: center;
      font-family: "Courier New", monospace;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.8);
    }
    .slot-input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 20px var(--gold-glow), inset 0 2px 5px rgba(0,0,0,0.5);
      background: #0f172a;
      transform: translateY(-2px);
    }
    .slot-input.filled {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .dash-sep {
      font-size: 2rem;
      color: #64748b;
      font-weight: 900;
      margin-top: 20px;
    }

    /* 螢幕虛擬數字鍵盤（支援觸控白板） */
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      max-width: 460px;
      margin: 0 auto 24px auto;
    }
    .key-btn {
      background: #1e293b;
      border: 1.5px solid #334155;
      color: #f8fafc;
      font-size: 1.45rem;
      font-weight: 800;
      padding: 12px 0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    }
    .key-btn:hover {
      background: #334155;
      border-color: var(--gold-primary);
      transform: translateY(-2px);
    }
    .key-btn:active { transform: translateY(1px); }
    .key-btn.action-btn {
      font-size: 1.05rem;
      background: #334155;
    }

    /* 主解鎖按鈕 */
    .unlock-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #020617;
      font-size: 1.35rem;
      font-weight: 900;
      border: none;
      padding: 16px 48px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4);
      transition: all 0.25s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .unlock-btn:hover {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 30px rgba(245, 158, 11, 0.6);
    }
    .unlock-btn:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* 狀態提示 */
    .status-msg {
      margin-top: 18px;
      font-size: 1.1rem;
      font-weight: 800;
      min-height: 32px;
      transition: all 0.3s;
    }
    .status-msg.error {
      color: var(--accent-red);
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    /* 成功浮層 (Modal) */
    .victory-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      backdrop-filter: blur(12px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .victory-modal.active {
      display: flex;
      animation: zoomIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1); }
    }
    .victory-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 4px solid var(--gold-primary);
      border-radius: 24px;
      padding: 40px 36px;
      max-width: 600px;
      text-align: center;
      box-shadow: 0 0 60px rgba(245, 158, 11, 0.6);
      position: relative;
    }
    .victory-card h2 {
      font-size: 2.5rem;
      font-weight: 900;
      color: #38bdf8;
      margin: 10px 0;
    }
    .badge-stamp {
      display: inline-block;
      border: 3px dashed var(--gold-primary);
      color: var(--gold-primary);
      font-size: 1.35rem;
      font-weight: 900;
      padding: 10px 24px;
      border-radius: 12px;
      margin: 20px 0;
      transform: rotate(-3deg);
      background: rgba(245, 158, 11, 0.1);
    }
    .victory-time {
      font-size: 1.25rem;
      color: #f1f5f9;
      margin: 12px 0 24px 0;
      font-weight: 700;
    }
    .btn-close-modal {
      background: var(--gold-primary);
      color: #020617;
      border: none;
      padding: 12px 32px;
      font-size: 1.1rem;
      font-weight: 900;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 頂部即時倒數與控制列 -->
  <div class="top-bar">
    <div class="brand-title">
      <span>⚙️ STEAM 創客密室逃脫</span>
      <span style="color:#64748b; font-size:0.85rem;">| 第 06 週 解謎篇</span>
    </div>
    
    <div class="timer-display" id="timer">40:00</div>

    <div class="timer-controls">
      <button class="btn-ctrl" onclick="startTimer()">▶ 啟動</button>
      <button class="btn-ctrl" onclick="pauseTimer()">⏸ 暫停</button>
      <button class="btn-ctrl" onclick="resetTimer()">↺ 重設</button>
    </div>
  </div>

  <!-- 主機台容器 -->
  <div class="terminal-container" id="terminal-box">
    <div class="rivet tl"></div>
    <div class="rivet tr"></div>
    <div class="rivet bl"></div>
    <div class="rivet br"></div>

    <div class="header-sub">DA VINCI CIPHER LOCK · 6-DIGIT PROTOCOL</div>
    <h1 class="header-main">達文西六位數機關密碼鎖</h1>
    <div class="prompt-text">
      🚨 達文西氣閘大門將於倒數結束後永久封閉！請各組從工具袋中搜尋真神信物，破解 <strong>6 大謎題</strong>，依序輸入 6 位數通關金鑰。
    </div>

    <!-- 六位數輸入槽 -->
    <div class="code-slots-wrapper">
      <div class="code-slot">
        <span class="slot-label">①繫繩</span>
        <input type="text" maxlength="1" class="slot-input" id="slot-0" inputmode="numeric" autocomplete="off">
      </div>
      <div class="code-slot">
        <span class="slot-label">②光陰</span>
        <input type="text" maxlength="1" class="slot-input" id="slot-1" inputmode="numeric" autocomplete="off">
      </div>
      <div class="code-slot">
        <span class="slot-label">③天平</span>
        <input type="text" maxlength="1" class="slot-input" id="slot-2" inputmode="numeric" autocomplete="off">
      </div>

      <div class="dash-sep">━</div>

      <div class="code-slot">
        <span class="slot-label">④旋輪</span>
        <input type="text" maxlength="1" class="slot-input" id="slot-3" inputmode="numeric" autocomplete="off">
      </div>
      <div class="code-slot">
        <span class="slot-label">⑤浮舟</span>
        <input type="text" maxlength="1" class="slot-input" id="slot-4" inputmode="numeric" autocomplete="off">
      </div>
      <div class="code-slot">
        <span class="slot-label">⑥法陣</span>
        <input type="text" maxlength="1" class="slot-input" id="slot-5" inputmode="numeric" autocomplete="off">
      </div>
    </div>

    <!-- 虛擬數字鍵盤 -->
    <div class="keypad-grid">
      <button class="key-btn" onclick="pressKey('1')">1</button>
      <button class="key-btn" onclick="pressKey('2')">2</button>
      <button class="key-btn" onclick="pressKey('3')">3</button>
      <button class="key-btn" onclick="pressKey('4')">4</button>
      <button class="key-btn" onclick="pressKey('5')">5</button>
      <button class="key-btn" onclick="pressKey('6')">6</button>
      <button class="key-btn" onclick="pressKey('7')">7</button>
      <button class="key-btn" onclick="pressKey('8')">8</button>
      <button class="key-btn" onclick="pressKey('9')">9</button>
      <button class="key-btn" onclick="pressKey('0')">0</button>
      <button class="key-btn action-btn" style="grid-column: span 2;" onclick="clearAll()">⌫ 清除全部</button>
      <button class="key-btn action-btn" style="grid-column: span 3;" onclick="backspaceKey()">⬅ 退格</button>
    </div>

    <!-- 解鎖驗證主按鈕 -->
    <div>
      <button class="unlock-btn" id="submit-btn" onclick="verifyPassword()">
        <span>🔓 驗證並解鎖氣閘</span>
      </button>
    </div>

    <div class="status-msg" id="status-display">請輸入完整 6 位數密碼後點擊驗證</div>
  </div>

  <!-- 成功通關浮層 -->
  <div class="victory-modal" id="victory-modal">
    <div class="victory-card">
      <div style="font-size: 3.5rem;">🎉</div>
      <h2>氣閘解除 · 逃脫成功！</h2>
      <div class="badge-stamp">🏆 達文西首席解謎特工勳章</div>
      <div class="victory-time" id="victory-time-record">剩餘時間：-- 分 -- 秒</div>
      <p style="color: #cbd5e1; line-height: 1.6; margin-bottom: 24px;">
        恭喜全組特工！成功從迷霧工具袋中識破假象、辨識真神信物，破解繫繩、逆光、平衡、旋輪、浮舟與法陣等六大古代謎題！
      </p>
      <button class="btn-close-modal" onclick="closeVictoryModal()">返回主畫面</button>
    </div>
  </div>

  <script>
    // 正確六位數金鑰：4 - 7 - 3 - 7 - 6 - 7
    const MASTER_KEY = "473767";
    let isLocked = false;
    let timerInterval = null;
    let totalSeconds = 40 * 60; // 40分鐘

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine', duration = 0.1) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playErrorSound() {
      playBeep(180, 'sawtooth', 0.25);
      setTimeout(() => playBeep(140, 'sawtooth', 0.35), 180);
    }

    function playSuccessSound() {
      const notes = [261.6, 329.6, 392.0, 523.3, 659.3, 783.9];
      notes.forEach((freq, i) => {
        setTimeout(() => playBeep(freq, 'triangle', 0.25), i * 90);
      });
    }

    // 初始化 6 格輸入格
    const slots = [];
    for (let i = 0; i < 6; i++) {
      const el = document.getElementById(`slot-${i}`);
      slots.push(el);

      el.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val ? val[val.length - 1] : '';
        if (e.target.value) {
          e.target.classList.add('filled');
          playBeep(520, 'sine', 0.05);
          if (i < 5) slots[i + 1].focus();
        } else {
          e.target.classList.remove('filled');
        }
      });

      el.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !el.value && i > 0) {
          slots[i - 1].focus();
        } else if (e.key === 'Enter') {
          verifyPassword();
        }
      });
    }

    function pressKey(num) {
      playBeep(480, 'sine', 0.05);
      for (let i = 0; i < 6; i++) {
        if (!slots[i].value) {
          slots[i].value = num;
          slots[i].classList.add('filled');
          if (i < 5) slots[i + 1].focus();
          return;
        }
      }
    }

    function backspaceKey() {
      playBeep(320, 'sine', 0.05);
      for (let i = 5; i >= 0; i--) {
        if (slots[i].value) {
          slots[i].value = '';
          slots[i].classList.remove('filled');
          slots[i].focus();
          return;
        }
      }
    }

    function clearAll() {
      playBeep(260, 'sine', 0.08);
      slots.forEach(s => {
        s.value = '';
        s.classList.remove('filled');
      });
      slots[0].focus();
    }

    // 驗證 6 位數金鑰
    function verifyPassword() {
      if (isLocked) return;

      let entered = '';
      for (let i = 0; i < 6; i++) {
        entered += slots[i].value;
      }

      const status = document.getElementById('status-display');
      const box = document.getElementById('terminal-box');

      if (entered.length < 6) {
        status.className = 'status-msg error';
        status.innerHTML = '⚠️ 請填滿全部 6 位數密碼後再按驗證！';
        playErrorSound();
        return;
      }

      if (entered === MASTER_KEY) {
        pauseTimer();
        playSuccessSound();
        status.className = 'status-msg';
        status.style.color = '#10b981';
        status.innerHTML = '✅ 密碼正確！達文西氣閘大門已開啟！';

        const min = Math.floor(totalSeconds / 60);
        const sec = totalSeconds % 60;
        document.getElementById('victory-time-record').innerText = 
          `成功解鎖時間紀錄：耗時 ${40 - min - 1} 分 ${60 - sec} 秒（剩餘 ${min} 分 ${sec < 10 ? '0' : ''}${sec} 秒）`;
        
        setTimeout(() => {
          document.getElementById('victory-modal').classList.add('active');
        }, 500);
      } else {
        playErrorSound();
        status.className = 'status-msg error';
        status.innerHTML = '❌ 密碼錯誤！齒輪卡死，警報鎖定中 (懲罰冷卻 15 秒)...';
        box.style.borderColor = '#ef4444';
        
        isLocked = true;
        document.getElementById('submit-btn').disabled = true;

        let cooldown = 15;
        const cdTimer = setInterval(() => {
          cooldown--;
          if (cooldown > 0) {
            status.innerHTML = `❌ 密碼錯誤！系統鎖定冷卻倒數 ${cooldown} 秒...`;
          } else {
            clearInterval(cdTimer);
            isLocked = false;
            document.getElementById('submit-btn').disabled = false;
            box.style.borderColor = 'var(--border-brass)';
            status.className = 'status-msg';
            status.innerHTML = '請檢查工具袋實測紀錄，重新鍵入 6 位數密碼。';
          }
        }, 1000);
      }
    }

    function closeVictoryModal() {
      document.getElementById('victory-modal').classList.remove('active');
    }

    function updateTimerDisplay() {
      const min = Math.floor(totalSeconds / 60);
      const sec = totalSeconds % 60;
      document.getElementById('timer').innerText = 
        `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        if (totalSeconds > 0) {
          totalSeconds--;
          updateTimerDisplay();
        } else {
          pauseTimer();
          alert('⏰ 40 分鐘時間到！氣閘大門已強制鎖死！');
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function resetTimer() {
      pauseTimer();
      totalSeconds = 40 * 60;
      updateTimerDisplay();
    }

    window.onload = () => {
      slots[0].focus();
    };
  </script>
</body>
</html>
